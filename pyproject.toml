[project]
name = "job-finder"
version = "0.1.0"
description = "Private single-user job finder service scaffold."
readme = "index.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "fastapi>=0.115.0",
    "httpx2>=1.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.32",
    "pytest>=9.0.0",
    "ruff>=0.12.0",
    "pytest-playwright>=0.8.0",
    "uvicorn>=0.51.0",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
extraPaths = ["src"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportMissingReturnType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
exclude = [".agents", ".opencode", ".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "FBT001",
    "FBT002",
    "FIX002",
    "ISC001",
    "TD002",
    "TD003",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "PLR2004", "S101", "SLF001"]
"tests/e2e/*.py" = ["PLC0415", "PT022", "S108", "S310", "S603", "TC003"]
"tests/security/*.py" = ["TC001", "TC003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
markers = [
    "e2e: end-to-end integration tests with fake MCP and test client",
    "security: sentinel privacy, retention, and default-deny security tests",
]
